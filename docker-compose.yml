services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./models:/app/models
      - ./dataset:/app/dataset:ro
      - ./data:/app/data
    environment:
      - PIP_DISABLE_PIP_VERSION_CHECK=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    depends_on:
      backend:
        condition: service_started
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    restart: unless-stopped
